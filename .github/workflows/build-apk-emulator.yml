name: Build APK + Emulador (Debug)

on:
  workflow_dispatch:
    inputs:
      enable_cache:
        description: 'Activar caché (Qt/Gradle)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilar APK Debug y probar en emulador
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: ${{ inputs.enable_cache && 'gradle' || '' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android NDK y build-tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          find "$ANDROID_SDK_ROOT/platforms" -mindepth 1 -maxdepth 1 -type d ! -name 'android-34' -exec rm -rf {} + 2>/dev/null || true
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install Qt 6.8.3 for Android
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'all_os'
          target: 'android'
          arch: 'android_arm64_v8a'
          cache: ${{ inputs.enable_cache }}

      - name: Configure (CMake) Debug
        run: |
          set -euo pipefail
          QT_ROOT="${QT_ROOT_DIR:-${{ steps.qt.outputs.qt-root-dir }}}"
          if [ -z "${QT_ROOT}" ] || [ ! -d "${QT_ROOT}" ]; then
            QT_ROOT="${RUNNER_WORKSPACE}/Qt/6.8.3/android_arm64_v8a"
          fi
          QT_HOST="${QT_HOST_PATH:-${{ steps.qt.outputs.qt-host-path }}}"
          if [ -z "${QT_HOST}" ] || [ ! -d "${QT_HOST}" ]; then
            QT_HOST="${RUNNER_WORKSPACE}/Qt/6.8.3/gcc_64"
          fi
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          QT_CMAKE="${QT_ROOT}/bin/qt-cmake"
          if [ ! -x "${QT_CMAKE}" ]; then
            QT_CMAKE="$(command -v qt-cmake || true)"
          fi
          "${QT_CMAKE}" -S . -B build \
            -DQT_HOST_PATH="${QT_HOST}" \
            -DANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}" \
            -DANDROID_NDK_ROOT="${ANDROID_NDK_ROOT}" \
            -DQT_ANDROID_ABIS="arm64-v8a" \
            -DCMAKE_BUILD_TYPE="Debug"

      - name: Build APK
        run: cmake --build build --target apk

      - name: Sign APK (debug keystore)
        run: |
          set -euo pipefail
          BT="/usr/local/lib/android/sdk/build-tools/34.0.0"
          KS="${RUNNER_TEMP}/debug.keystore"
          rm -f "${KS}"
          keytool -genkeypair -v -keystore "${KS}" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          mkdir -p build/signed-apk
          shopt -s nullglob
          for apk in build/android-build/*.apk; do
            base="$(basename "${apk}")"
            aligned="build/signed-apk/${base%.apk}-aligned.apk"
            signed="build/signed-apk/${base}"
            "${BT}/zipalign" -f -p 4 "${apk}" "${aligned}"
            "${BT}/apksigner" sign --ks "${KS}" --ks-key-alias androiddebugkey \
              --ks-pass pass:android --key-pass pass:android --out "${signed}" "${aligned}"
            rm -f "${aligned}"
          done
          ls -lh build/signed-apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: screenrecorder-apk-debug
          path: build/signed-apk/*.apk

      - name: Smoke test en emulador (renderizar teléfono)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          force-avd-creation: true
          script: |
            set -euo pipefail
            APK="$(ls build/signed-apk/*.apk | head -n1)"
            adb install -r "$APK"
            adb shell am start -n org.qtproject.example.screenrecorder/org.qtproject.qt.android.bindings.QtActivity
            sleep 12
            adb exec-out screencap -p > emulator-screenshot.png
            echo "Captura guardada"

      - name: Upload captura del emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot
          path: emulator-screenshot.png
