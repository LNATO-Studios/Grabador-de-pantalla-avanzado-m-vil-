name: Build APK

on:
  workflow_dispatch:
    inputs:
      enable_cache:
        description: 'Activar caché (Qt/Gradle)'
        type: boolean
        default: false

jobs:
  build:
    name: Compilar APK (Qt 6.8 / Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: ${{ inputs.enable_cache && 'gradle' || '' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android NDK y build-tools
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install Qt 6.8.3 for Android
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'all_os'
          target: 'android'
          arch: 'android_arm64_v8a'
          cache: ${{ inputs.enable_cache }}

      - name: Configure (CMake)
        run: |
          set -e
          QT_ROOT="${{ steps.qt.outputs.qt-root-dir }}"
          "$QT_ROOT/bin/qt-cmake" -S . -B build \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DQT_ANDROID_ABIS="arm64-v8a" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build APK
        run: cmake --build build --target apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: screenrecorder-apk
          path: build/android-build/*.apk
